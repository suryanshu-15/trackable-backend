# Production-like stack: PostgreSQL 16, Redis (shared throttle cache), the Django API and the
# Next.js frontend. Put a TLS-terminating reverse proxy in front of `frontend` (port 3000).
# Secrets come from the environment / an .env file next to this file — never commit them.
#   docker compose up -d --build
#   docker compose exec backend python manage.py createsuperuser
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-trackable}
      POSTGRES_USER: ${DB_USER:-trackable}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trackable}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      # "backend" is how the frontend container reaches the API
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost},backend
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-trackable}
      DB_USER: ${DB_USER:-trackable}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /data/media
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Kolkata}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://localhost}
      LOG_FORMAT: json
      # TLS is terminated by the reverse proxy in front of this service
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
    volumes:
      - media:/data/media
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Kolkata}
    depends_on: [backend]
    environment:
      BACKEND_URL: http://backend:8000
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
  media:

components:
  schemas:
    AdjustmentTypeEnum:
      enum:
      - INCREASE
      - DECREASE
      - CORRECTION
      type: string
      description: |-
        * `INCREASE` - Increase
        * `DECREASE` - Decrease
        * `CORRECTION` - Physical Count Correction
    AttachmentUploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
        document_type:
          $ref: '#/components/schemas/LabDocumentTypeEnum'
        notes:
          type: string
          default: ''
          maxLength: 500
      required:
      - document_type
      - file
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        actor:
          type: integer
          readOnly: true
          nullable: true
        actor_name:
          type: string
          readOnly: true
        action:
          type: string
          readOnly: true
        entity_type:
          type: string
          readOnly: true
        entity_id:
          type: string
          readOnly: true
        reason:
          type: string
          readOnly: true
        before_state:
          readOnly: true
          nullable: true
        after_state:
          readOnly: true
          nullable: true
        extra:
          readOnly: true
          nullable: true
      required:
      - action
      - actor
      - actor_name
      - after_state
      - before_state
      - entity_id
      - entity_type
      - extra
      - id
      - reason
      - timestamp
    ChangePasswordRequest:
      type: object
      properties:
        old_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 8
        new_password_confirm:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - new_password
      - new_password_confirm
      - old_password
    CollectRequest:
      type: object
      properties:
        draws:
          type: array
          items:
            $ref: '#/components/schemas/DrawRequest'
        sampled_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,4})?$
          nullable: true
        sampled_unit:
          type: integer
          nullable: true
        sampled_at:
          type: string
          format: date-time
          nullable: true
        sample_condition:
          type: string
          default: ''
    DecisionNotesRequest:
      type: object
      properties:
        notes:
          type: string
          default: ''
    Department:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        factory_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        code:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 200
        is_active:
          type: boolean
        factory:
          type: integer
      required:
      - code
      - created_at
      - factory
      - factory_name
      - id
      - name
      - updated_at
    DepartmentRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 50
        name:
          type: string
          minLength: 1
          maxLength: 200
        is_active:
          type: boolean
        factory:
          type: integer
      required:
      - code
      - factory
      - name
    DiscrepancyStatusEnum:
      enum:
      - NONE
      - UNIT_MISMATCH
      - QUANTITY_SHORT
      - QUANTITY_EXCESS
      - DAMAGED
      - DESCRIPTION_MISMATCH
      - UNIDENTIFIED
      - REJECTED
      - MULTIPLE
      type: string
      description: |-
        * `NONE` - No Discrepancy
        * `UNIT_MISMATCH` - Unit differs and no conversion is configured
        * `QUANTITY_SHORT` - Short Quantity
        * `QUANTITY_EXCESS` - Excess Quantity
        * `DAMAGED` - Damaged
        * `DESCRIPTION_MISMATCH` - Description Mismatch
        * `UNIDENTIFIED` - Unidentified Material
        * `REJECTED` - Line Rejected
        * `MULTIPLE` - Multiple Discrepancies
    DisposalInputRequest:
      type: object
      properties:
        package:
          type: string
          format: uuid

  /api/v1/receiving/goods-receipts/:
    get:
      operationId: receiving_goods_receipts_list
      description: |-
        Gate receipt CRUD + state-machine transition actions.
        Receipts are never deleted; a draft or registered receipt can be cancelled.
      parameters:
      - in: query
        name: arrival_from
        schema:
          type: string
          format: date
      - in: query
        name: arrival_to
        schema:
          type: string
          format: date
      - in: query
        name: invoice_date
        schema:
          type: string
          format: date
      - in: query
        name: material
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
            enum:
            - AWAITING_UNLOADING
            - CANCELLED
            - CLOSED
            - DRAFT
            - EXCEPTION
            - GATE_REGISTERED
            - PUTAWAY_IN_PROGRESS
            - STORED
            - UNLOADED
            - UNLOADING_IN_PROGRESS
            - VERIFICATION_PENDING
        description: |-
          * `DRAFT` - Draft
          * `GATE_REGISTERED` - Gate Registered
          * `AWAITING_UNLOADING` - Awaiting Unloading
          * `UNLOADING_IN_PROGRESS` - Unloading In Progress
          * `VERIFICATION_PENDING` - Verification Pending
          * `EXCEPTION` - Exception
          * `UNLOADED` - Unloaded
          * `PUTAWAY_IN_PROGRESS` - Put-away In Progress
          * `STORED` - Stored
          * `CLOSED` - Closed
          * `CANCELLED` - Cancelled
        explode: true
        style: form
      - in: query
        name: supplier
        schema:
          type: integer
      - in: query
        name: vehicle_number
        schema:
          type: string
      tags:
      - receiving
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGoodsReceiptListList'
          description: ''
    post:
      operationId: receiving_goods_receipts_create
      description: |-
        Gate receipt CRUD + state-machine transition actions.
        Receipts are never deleted; a draft or registered receipt can be cancelled.
      parameters:
      - in: query
        name: acknowledge_duplicate
        schema:
          type: boolean
        description: Proceed even though a matching supplier invoice exists.
      tags:
      - receiving
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoodsReceiptRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoodsReceiptRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoodsReceiptRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':

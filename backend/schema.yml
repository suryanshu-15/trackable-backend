    PackageStatusEnum:
      enum:
      - CREATED
      - AWAITING_PUTAWAY
      - STORED
      - ISSUED
      - REPACKED
      - DISPOSED
      - SUPPLIER_RETURNED
      type: string
      description: |-
        * `CREATED` - Created (label not printed)
        * `AWAITING_PUTAWAY` - Awaiting Put-away
        * `STORED` - Stored
        * `ISSUED` - Fully Issued
        * `REPACKED` - Repacked into child packages
        * `DISPOSED` - Disposed
        * `SUPPLIER_RETURNED` - Returned to Supplier

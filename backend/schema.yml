        description: A search term.
        schema:
          type: string
      - in: query
        name: verification_status
        schema:
          type: string
          enum:
          - DISCREPANT
          - EXCEPTION_ACCEPTED
          - PENDING
          - VERIFIED
        description: |-
          * `PENDING` - Pending
          * `VERIFIED` - Verified (No Discrepancy)
          * `DISCREPANT` - Discrepant — Flagged for Review
          * `EXCEPTION_ACCEPTED` - Exception Accepted by Authority
      - in: query
        name: verification_status__in
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      tags:
      - receiving
      security:
      - jwtAuth: []
      responses:

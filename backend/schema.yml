  /api/v1/inventory/adjustments/:
    get:
      operationId: inventory_adjustments_list
      description: INCREASE / DECREASE carry a positive amount; CORRECTION carries
        the physically counted quantity.
      parameters:
      - in: query
        name: adjustment_type
        schema:
          type: string
          enum:
          - CORRECTION
          - DECREASE
          - INCREASE
        description: |-
          * `INCREASE` - Increase
          * `DECREASE` - Decrease
          * `CORRECTION` - Physical Count Correction
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: package
        schema:
          type: string
          format: uuid
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - APPROVED
          - PENDING
          - REJECTED
        description: |-
          * `PENDING` - Pending Approval
          * `APPROVED` - Approved
          * `REJECTED` - Rejected
      tags:
      - inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStockAdjustmentList'
          description: ''
    post:
      operationId: inventory_adjustments_create
      description: INCREASE / DECREASE carry a positive amount; CORRECTION carries
        the physically counted quantity.
      tags:
      - inventory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAdjustmentInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StockAdjustmentInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StockAdjustmentInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockAdjustment'
          description: ''
  /api/v1/inventory/adjustments/{id}/:
    get:
      operationId: inventory_adjustments_retrieve

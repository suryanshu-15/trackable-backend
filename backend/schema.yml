      description: Verifications are recorded via POST /invoice-lines/{id}/verify/;
        this exposes them and the review action.
      parameters:
      - in: query
        name: discrepancy_status
        schema:
          type: string
          enum:
          - DAMAGED
          - DESCRIPTION_MISMATCH
          - MULTIPLE
          - NONE
          - QUANTITY_EXCESS
          - QUANTITY_SHORT
          - REJECTED
          - UNIDENTIFIED
          - UNIT_MISMATCH
        description: |-
          * `NONE` - No Discrepancy
          * `UNIT_MISMATCH` - Unit differs and no conversion is configured
          * `QUANTITY_SHORT` - Short Quantity
          * `QUANTITY_EXCESS` - Excess Quantity
          * `DAMAGED` - Damaged
          * `DESCRIPTION_MISMATCH` - Description Mismatch
          * `UNIDENTIFIED` - Unidentified Material
          * `REJECTED` - Line Rejected
          * `MULTIPLE` - Multiple Discrepancies
      - in: query
        name: invoice_line__receipt
        schema:
          type: string
          format: uuid

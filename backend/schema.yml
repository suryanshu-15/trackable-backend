  /api/v1/inventory/issues/:
    get:
      operationId: inventory_issues_list
      parameters:
      - in: query
        name: department
        schema:
          type: integer
      - in: query
        name: factory
        schema:
          type: integer
      - in: query
        name: fifo_override
        schema:
          type: boolean
      - in: query
        name: issued_from
        schema:
          type: string
          format: date
      - in: query
        name: issued_to
        schema:
          type: string
          format: date
      - in: query
        name: material
        schema:
          type: integer
      - in: query
        name: material_request
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: package
        schema:
          type: string
          format: uuid
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: production_order
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACKNOWLEDGED
          - ISSUED
        description: |-
          * `ISSUED` - Issued
          * `ACKNOWLEDGED` - Receipt acknowledged
      tags:
      - issue
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMaterialIssueList'
          description: ''
    post:
      operationId: inventory_issues_create
      description: Issue packages in one atomic transaction (retry-safe with an Idempotency-Key
        header).
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
      tags:
      - issue
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialIssueInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MaterialIssueInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MaterialIssueInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialIssue'
          description: ''
  /api/v1/inventory/issues/{id}/:
    get:
      operationId: inventory_issues_retrieve
      parameters:
      - in: path
